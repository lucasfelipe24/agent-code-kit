name: Docs site

# Builds web/ (Fumadocs, static export) from the kit's own sources and deploys
# it to GitHub Pages. PRs build and link-check only; main also deploys (ADR-036).
# Keep the two `paths` lists in step: they are what the site is built from.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/gen-skill-docs.sh'
      - 'README.md'
      - 'README.pt-BR.md'
      - 'CHANGELOG.md'
      - 'VERSION'
      - 'WIKI.md'
      - 'ARTIFACTS.md'
      - 'agent_docs/**'
      - 'examples/**'
      - 'wiki-module/**'
      - '.claude/skills/**'
      - '.claude/agents/**'
      - '.claude/hooks/**'
      - '.claude/kit/**'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/gen-skill-docs.sh'
      - 'README.md'
      - 'README.pt-BR.md'
      - 'CHANGELOG.md'
      - 'VERSION'
      - 'WIKI.md'
      - 'ARTIFACTS.md'
      - 'agent_docs/**'
      - 'examples/**'
      - 'wiki-module/**'
      - '.claude/skills/**'
      - '.claude/agents/**'
      - '.claude/hooks/**'
      - '.claude/kit/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      # prebuild runs scripts/gen-skill-docs.sh, which fails on a missing
      # source; --check afterwards proves the generator is deterministic.
      - name: Build
        working-directory: web
        run: npm run build

      - name: Generated pages are reproducible
        run: bash scripts/gen-skill-docs.sh --check

      # lychee reads .txt as plain text and skips relative links, so assert the
      # llms files' links carry the base path directly.
      - name: llms files link under the base path
        run: |
          if grep -nP '\]\(/(?!/|agent-code-kit/)' web/out/llms.txt web/out/llms-full.txt; then
            echo "::error::llms link without the /agent-code-kit base path (see withBaseLinks in web/lib/shared.ts)"
            exit 1
          fi

      # Pages serves the site under /agent-code-kit, so check it mounted there.
      - name: Stage under the base path
        run: mkdir -p _site && cp -r web/out _site/agent-code-kit

      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          # --index-files: a link to dir/#frag is checked against dir/index.html
          lycheeVersion: v0.24.2
          args: --offline --no-progress --include-fragments --index-files index.html --root-dir ${{ github.workspace }}/_site '_site/**/*.html' '_site/**/content.md'
          fail: true

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: web/out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
